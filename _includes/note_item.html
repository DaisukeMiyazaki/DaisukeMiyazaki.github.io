<!-- ノート1件。本文をその場に展開する。include.noteにdocumentを渡す -->
<article class="border-b border-gray-200 py-3 dark:border-gray-800">
  <p class="text-xs text-gray-500 dark:text-gray-400">
    <time datetime="{{ include.note.date | date_to_xmlschema }}"
      >{{include.note.date | date: "%b %-d, %Y"}}</time
    >
  </p>
  <h2 class="mb-2 mt-1 text-base font-bold">
    <a
      href="{{ include.note.url | relative_url }}"
      class="text-gray-900 no-underline hover:text-blue-600 dark:text-gray-50 dark:hover:text-blue-400"
    >
      {{include.note.title}}
    </a>
  </h2>
  <div class="dark:prose-inver prose prose-sm w-full max-w-none break-words">
    {{ include.note.content}}
  </div>
</article>
