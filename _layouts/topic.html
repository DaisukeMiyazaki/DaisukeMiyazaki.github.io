---
layout: default
---

<div class="dark:text-gray-100">
  <h1 class="mb-4 text-base font-bold">#{{ page.topic }}</h1>
  {% for post in page.posts %}
  <a href="{{ post.url }}" class="group mb-4 block">
    <time class="text-xs text-gray-400 dark:text-gray-500"
      >{{ post.date | date: "%d %b %Y" }}</time
    >
    <h2
      class="mb-1 text-base font-bold leading-snug transition-colors group-hover:text-blue-600 dark:group-hover:text-blue-400"
    >
      {{ post.title }}
    </h2>
    <p
      class="line-clamp-3 text-sm leading-relaxed text-gray-600 dark:text-gray-400"
    >
      {{ post.excerpt | strip_html }}
    </p>
  </a>
  {% endfor %}
</div>
