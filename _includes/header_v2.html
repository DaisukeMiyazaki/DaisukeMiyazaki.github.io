<header
  class="bg-white py-6 transition-colors duration-300 dark:bg-primary-dark"
>
  <nav class="container mx-auto flex max-w-2xl items-center px-6 text-base">
    <!-- タイトル -->
    <a
      href="{{ site.baseurl }}/"
      class="flex-grow text-xl font-medium text-gray-900 no-underline hover:opacity-80 dark:text-white"
    >
      Daisuke Miyazaki{% if page.topic %}<span class="font-bold">
        / {{ page.topic }}</span
      >{% endif %}
    </a>

    <!-- 言語切り替え・About -->
    <span class="mr-8 flex gap-8">
      {% if page.lang == 'jp' %}
      <a
        href="/en/"
        class="text-gray-500 no-underline hover:text-gray-900 dark:text-gray-400 dark:hover:text-white"
        aria-label="Switch to English"
        >EN</a
      >
      <a
        href="/jp/now/"
        class="text-gray-500 no-underline hover:text-gray-900 dark:text-gray-400 dark:hover:text-white"
        >Now</a
      >
      <a
        href="/jp/1995/09/02/自己紹介/"
        class="text-gray-500 no-underline hover:text-gray-900 dark:text-gray-400 dark:hover:text-white"
        >About</a
      >
      {% else %}
      <a
        href="/"
        class="text-gray-500 no-underline hover:text-gray-900 dark:text-gray-400 dark:hover:text-white"
        aria-label="Switch to Japanese"
        >JP</a
      >
      <a
        href="/en/now/"
        class="text-gray-500 no-underline hover:text-gray-900 dark:text-gray-400 dark:hover:text-white"
        >Now</a
      >
      <a
        href="/en/1995/09/02/about/"
        class="text-gray-500 no-underline hover:text-gray-900 dark:text-gray-400 dark:hover:text-white"
        >About</a
      >
      {% endif %}
    </span>

    <!-- ダークモード切り替え -->
    <button
      id="theme-toggle"
      type="button"
      role="switch"
      aria-label="Toggle dark mode"
      class="group relative h-5 w-9 shrink-0 focus:outline-none"
    >
      <span
        class="absolute inset-0 rounded-full border border-gray-300 dark:border-gray-600"
      ></span>
      <span
        class="absolute left-px top-px h-[18px] w-[18px] text-gray-500 transition-[left] duration-100 group-hover:text-blue-500 dark:left-4 dark:text-gray-100"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 20 20"
          fill="currentColor"
          class="h-full w-full dark:hidden"
        >
          <path
            fill-rule="evenodd"
            d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"
            clip-rule="evenodd"
          />
        </svg>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="hidden h-full w-full dark:block"
        >
          <path
            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
          />
        </svg>
      </span>
    </button>
  </nav>
</header>

<script>
  (function () {
    const themeToggleBtn = document.getElementById("theme-toggle");

    function syncToggle() {
      if (themeToggleBtn) {
        themeToggleBtn.setAttribute(
          "aria-checked",
          document.documentElement.classList.contains("dark"),
        );
      }
    }

    // 初期化ロジック（ページロード時に実行）
    // ※ head.html などで既に実行されている場合もあるが、ボタンの状態同期のためにここでも確認
    if (
      localStorage.getItem("theme") === "dark" ||
      (!("theme" in localStorage) &&
        window.matchMedia("(prefers-color-scheme: dark)").matches)
    ) {
      document.documentElement.classList.add("dark");
    } else {
      document.documentElement.classList.remove("dark");
    }
    syncToggle();

    if (themeToggleBtn) {
      themeToggleBtn.addEventListener("click", function () {
        if (document.documentElement.classList.contains("dark")) {
          document.documentElement.classList.remove("dark");
          localStorage.setItem("theme", "light");
        } else {
          document.documentElement.classList.add("dark");
          localStorage.setItem("theme", "dark");
        }
        syncToggle();
      });
    }
  })();
</script>
